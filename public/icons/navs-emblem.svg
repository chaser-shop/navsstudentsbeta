<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Starburst/Sunburst Academy Accents -->
  <circle cx="60" cy="60" r="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="60" cy="60" r="52" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Academy Laurel Wreath -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M22 62 C20 45, 30 25, 48 16 C46 22, 42 30, 36 36 C30 42, 24 52, 22 62 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>
    <path d="M98 62 C100 45, 90 25, 72 16 C74 22, 78 30, 84 36 C90 42, 96 52, 98 62 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>
    <path d="M26 70 C24 82, 34 98, 50 106 C46 100, 40 92, 36 84 C32 76, 28 72, 26 70 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>
    <path d="M94 70 C96 82, 86 98, 70 106 C74 100, 80 92, 84 84 C88 76, 92 72, 94 70 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Central Academy Shield -->
  <path d="M60 18 L86 28 C86 58, 76 84, 60 98 C44 84, 34 58, 34 28 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M60 22 L82 31 C82 56, 73 78, 60 90 C47 78, 38 56, 38 31 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7"/>

  <!-- Ukrainian Academic Tryzub (Trident) & Scales of Justice symbol -->
  <!-- Central Axis Sword/Spire -->
  <path d="M60 30 L60 76 M56 34 L64 34 M54 44 L66 44 M58 76 L62 76" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tryzub Left Wing -->
  <path d="M60 52 C52 52, 47 45, 47 38 C47 33, 49 32, 51 32 C52 32, 53 34, 53 37 C53 45, 57 48, 60 49"
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tryzub Right Wing -->
  <path d="M60 52 C68 52, 73 45, 73 38 C73 33, 71 32, 69 32 C68 32, 67 34, 67 37 C67 45, 63 48, 60 49"
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Scales of Justice (T-Bar & Pans) -->
  <path d="M48 54 L72 54" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M49 54 L44 64 M53 54 L44 64" stroke="url(#goldGrad)" stroke-width="1"/>
  <path d="M40 64 C40 67, 48 67, 48 64 Z" fill="url(#goldGrad)"/>
  <path d="M71 54 L76 64 M67 54 L76 64" stroke="url(#goldGrad)" stroke-width="1"/>
  <path d="M72 64 C72 67, 80 67, 80 64 Z" fill="url(#goldGrad)"/>

  <!-- Academy Ribbon / Banner below shield -->
  <path d="M30 96 L45 92 L60 95 L75 92 L90 96 L85 104 L60 100 L35 104 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="60" y="100.5" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="6" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">НАВС</text>
</svg>
